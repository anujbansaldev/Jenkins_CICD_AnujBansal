services:
  backend:
    build: ./Backend
    environment:
      PORT: "5000"
    expose: ["5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; r=urlopen('http://127.0.0.1:5000/api/health', timeout=3); exit(0 if r.status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
  frontend:
    build: ./Frontend
    environment:
      PORT: "3000"
      BACKEND_URL: http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
